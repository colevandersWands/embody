name: Feature Request
description: Suggest a new feature or improvement for @study-lenses/embody
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement.

        Remember: embody provides **neutral execution traces** (infrastructure).
        Educational interpretation belongs in downstream tools. If your request
        involves pedagogical decisions, it may belong in a different project.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: |
        What problem does this feature solve? Describe the limitation or
        pain point you are experiencing.
      placeholder: "I'm trying to [...] but currently [...]"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: |
        How do you think this should work? Include API examples if possible.
      placeholder: |
        ```javascript
        // Example of how the feature would be used:
        const steps = trace('code', { newOption: true });
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: |
        What other approaches did you consider? Why is this approach better?
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Feature Scope
      description: Which part of embody does this affect?
      options:
        - Configuration (presets, options)
        - Tracing pipeline (instrument, record, trace)
        - API surface (embody, squint, embodify, pickles)
        - Serialization (serialize, deserialize)
        - Types / TypeScript
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: |
        Any other context, examples from other tools, research references, etc.
    validations:
      required: false
